name: Refresh Europe PMC and publish ICU Evidence

on:
  workflow_dispatch:
  schedule:
  - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: icu-evidence-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Import Europe PMC publications
        run: python scripts/refresh_europepmc.py

      - name: Save updated evidence
        id: index
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          changed=false
          if [ -n "$(git status --porcelain -- dist/evidence.json dist/version.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist/evidence.json dist/version.json
            git commit -m "Refresh Europe PMC evidence"
            git push origin HEAD
            changed=true
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$changed" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.index.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@v4
        if: steps.index.outputs.publish == 'true'
        with:
          path: dist
          retention-days: 1

      - name: Publish the library
        if: steps.index.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
