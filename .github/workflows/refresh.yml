name: Refresh and publish ICU Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: icu-evidence-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install importer dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh Journal Watch
        run: python scripts/refresh.py
      - name: Keep the refreshed index for the next run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Journal Watch evidence"
            git push origin HEAD
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
      - name: Publish the library
        id: deployment
        uses: actions/deploy-pages@v4
