name: Test Journal Watch browser access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Test Journal Watch access
        run: |
          python - <<'PY'
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from playwright.sync_api import sync_playwright

          sys.path.insert(0, "scripts")
          import refresh

          today = datetime.now(ZoneInfo("Australia/Sydney")).date()

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              response = page.goto(
                  refresh.SOURCE,
                  wait_until="domcontentloaded",
                  timeout=60000,
              )

              print("HTTP status:", response.status if response else "Unknown")
              print("Page title:", page.title())

              if response and response.status >= 400:
                  raise RuntimeError("Journal Watch refused browser access.")

              rows = refresh.parse_source(
                  page.content(),
                  refresh.cutoff(today),
                  today,
              )

              if not rows:
                  raise RuntimeError("The page loaded without article listings.")

              print("SUCCESS: Journal Watch articles are readable.")
              print("Entries found:", len(rows))
              print("Latest entry:", max(row["date"] for row in rows))
              browser.close()
          PY
